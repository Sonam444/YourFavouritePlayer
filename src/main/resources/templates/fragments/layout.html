<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${pageTitle} + ' | Your Favourite Player'">Your Favourite Player</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="topbar" th:fragment="nav">
	<a class="brand" th:href="@{/players}">
		<span class="brand-mark">YFP</span>
		<span>Your Favourite Player</span>
	</a>
	<div class="nav-actions">
		<a th:href="@{/players}">Ranking</a>
		<a th:if="${loggedIn}" th:href="@{/players/new}">Add Player</a>
		<a th:unless="${loggedIn}" th:href="@{/login}">Login</a>
		<a th:unless="${loggedIn}" class="button button-primary" th:href="@{/signup}">Sign Up</a>
		<form th:if="${loggedIn}" th:action="@{/logout}" method="post" class="inline-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button class="button button-ghost" type="submit" th:text="'Logout ' + ${currentUsername}">Logout</button>
		</form>
	</div>
</nav>
</body>
</html>
