<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="page-shell narrow-shell">
	<section class="form-panel">
		<p class="eyebrow">Welcome back</p>
		<h1>Login</h1>
		<div th:if="${successMessage}" class="notice" th:text="${successMessage}">Account created</div>
		<div th:if="${param.error}" class="alert">Invalid username or password.</div>
		<form th:action="@{/login}" method="post" class="stacked-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<div class="field">
				<label for="username">Username</label>
				<input id="username" type="text" name="username" autocomplete="username">
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" type="password" name="password" autocomplete="current-password">
			</div>
			<div class="form-actions">
				<a class="button button-ghost" th:href="@{/signup}">Sign Up</a>
				<button class="button button-primary" type="submit">Login</button>
			</div>
		</form>
	</section>
</main>
</body>
</html>
