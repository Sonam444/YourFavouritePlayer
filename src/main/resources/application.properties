spring.application.name=YourFavouritePlayer
server.port=${PORT:8080}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mydatabase}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:myuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:secret}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=${UPLOAD_DIR:uploads}
